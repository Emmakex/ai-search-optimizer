name: Phase 5C.1 bootstrap

on:
  push:
    branches:
      - release/phase5c1-wordpress-0.5.1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/phase5c1-wordpress-0.5.1
          fetch-depth: 0

      - name: Correct generated CI snapshot indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('phase5c1-ci.generated.yml')
          text = p.read_text()
          marker = 'cta_production:\n'
          if marker not in text:
              print('Generated CI snapshot already normalized.')
              raise SystemExit(0)
          start = text.index(marker)
          end = text.index('\n  package_evidence:\n', start)
          block = text[start:end]
          block = '\n'.join(('  ' + line) if line else line for line in block.split('\n'))
          p.write_text(text[:start] + block + text[end:])
          PY
          git diff --check -- phase5c1-ci.generated.yml

      - name: Commit corrected snapshot when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- phase5c1-ci.generated.yml; then
            echo "No snapshot correction required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase5c1-ci.generated.yml
          git commit -m "ci: normalize Phase 5C.1 generated workflow"
          git push origin HEAD:release/phase5c1-wordpress-0.5.1
