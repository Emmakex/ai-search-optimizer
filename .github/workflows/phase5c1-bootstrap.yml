name: Phase 5C.1 bootstrap

on:
  push:
    branches:
      - release/phase5c1-wordpress-0.5.1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/phase5c1-wordpress-0.5.1
          fetch-depth: 0

      - name: Apply 0.5.1 hardening
        run: python3 scripts/phase5c1-bootstrap.py

      - name: Validate generated diff
        run: |
          git diff --check
          git status --short

      - name: Stage generated candidate without workflow mutation
        run: |
          set -euo pipefail
          cp .github/workflows/ci.yml phase5c1-ci.generated.yml
          git checkout -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai-search-optimizer.php \
            readme.txt \
            tests/release-metadata-check.php \
            scripts/runtime-release-lifecycle.sh \
            scripts/verify-kairoseth-cta.sh \
            README.md \
            CHANGELOG.md \
            SECURITY.md \
            phase5c1-ci.generated.yml
          git diff --cached --check
          git commit -m "release: prepare WordPress.org 0.5.1 submission candidate"
          git push origin HEAD:release/phase5c1-wordpress-0.5.1
