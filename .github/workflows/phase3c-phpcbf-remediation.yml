name: Phase 3C PHPCBF remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.event.pull_request.number == 20 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install quality dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer create-project --no-interaction --prefer-dist --no-progress friendsofphp/php-cs-fixer /tmp/php-cs-fixer

      - name: Apply documentation and Yoda remediation
        shell: bash
        run: |
          python3 scripts/phase3c-docblock-remediation.py

          for target in ai-search-optimizer.php uninstall.php includes; do
            /tmp/php-cs-fixer/vendor/bin/php-cs-fixer fix "$target" \
              --using-cache=no \
              --allow-risky=no \
              --rules='{"yoda_style":{"equal":true,"identical":true,"less_and_greater":null,"always_move_variable":true}}'
          done

          set +e
          vendor/bin/phpcbf -q --standard=phpcs.xml.dist
          phpcbf_status=$?
          set -e
          echo "PHPCBF exit: $phpcbf_status"

          find ai-search-optimizer.php uninstall.php includes -name "*.php" -type f -print0 | xargs -0 -n1 php -l

          set +e
          vendor/bin/phpcs -q --standard=phpcs.xml.dist --report=json > phase3c-remediation-report.json
          phpcs_status=$?
          set -e

          echo "Remaining PHPCS findings:"
          jq '.totals' phase3c-remediation-report.json
          git diff --stat -- ai-search-optimizer.php uninstall.php includes

          if ! git diff --quiet -- ai-search-optimizer.php uninstall.php includes; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ai-search-optimizer.php uninstall.php includes
            git commit -m "style(p3c): complete WPCS source normalization"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

          exit "$phpcs_status"

      - name: Upload remediation report
        if: ${{ always() && hashFiles('phase3c-remediation-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-remediation-${{ github.run_id }}
          path: phase3c-remediation-report.json
          if-no-files-found: error
          retention-days: 30
