name: Phase 3C PHPCBF remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.event.pull_request.number == 20 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install quality dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply PHPCBF-safe fixes
        shell: bash
        run: |
          set +e
          vendor/bin/phpcbf -q --standard=phpcs.xml.dist
          phpcbf_status=$?
          set -e

          echo "PHPCBF exit: $phpcbf_status"
          git diff --stat -- ai-search-optimizer.php uninstall.php includes

          if git diff --quiet -- ai-search-optimizer.php uninstall.php includes; then
            echo "No PHPCBF changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-search-optimizer.php uninstall.php includes
          git commit -m "style(p3c): apply PHPCBF safe fixes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
