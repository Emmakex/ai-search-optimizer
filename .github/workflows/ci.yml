name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment
        run: |
          php --version
          node --version
          zip -v | head -n 2
          unzip -v | head -n 2

      - name: PHP syntax
        run: bash scripts/ci-run.sh "PHP syntax" bash -c 'find ai-search-optimizer.php uninstall.php includes tests -name "*.php" -type f -print0 | xargs -0 -n1 php -l'

      - name: Shell syntax
        run: bash scripts/ci-run.sh "Shell syntax" bash -n scripts/build-plugin.sh scripts/build-release-candidate.sh scripts/build-development-package.sh scripts/runtime-wordpress.sh scripts/runtime-multisite-woocommerce.sh scripts/runtime-admin-ux.sh scripts/runtime-release-lifecycle.sh scripts/verify-kairoseth-cta.sh scripts/publish-github-release.sh

      - name: Contract and security regression
        run: bash scripts/ci-run.sh "Contract and security regression" php tests/contract-check.php

      - name: Local Free analysis regression
        run: bash scripts/ci-run.sh "Local Free analysis regression" php tests/local-free-check.php

      - name: Safe local publication regression
        run: bash scripts/ci-run.sh "Safe local publication regression" php tests/local-publication-check.php

      - name: Lifecycle and uninstall regression
        run: bash scripts/ci-run.sh "Lifecycle and uninstall regression" php tests/lifecycle-check.php

      - name: Responsive and accessibility regression
        run: bash scripts/ci-run.sh "Responsive and accessibility regression" php tests/ux-hardening-check.php

      - name: Kairoseth contextual support regression
        run: bash scripts/ci-run.sh "Kairoseth contextual support regression" php tests/kairoseth-support-check.php

      - name: Stable release metadata alignment
        run: bash scripts/ci-run.sh "Stable release metadata alignment" php tests/release-metadata-check.php

      - name: GitHub release publication contract
        run: bash scripts/ci-run.sh "GitHub release publication contract" php tests/release-publication-check.php

      - name: Kairoseth CTA production contract
        run: bash scripts/ci-run.sh "Kairoseth CTA production contract" bash scripts/verify-kairoseth-cta.sh

      - name: Build plugin package
        run: bash scripts/ci-run.sh "Build plugin package" bash scripts/build-plugin.sh

      - name: Verify package contents
        run: bash scripts/ci-run.sh "Verify package contents" bash scripts/check-package.sh

      - name: Verify repository cleanliness
        run: |
          if [[ -n "$(git status --short --untracked-files=all)" ]]; then
            git status --short --untracked-files=all
            echo "Repository changed during validation." >&2
            exit 1
          fi

  php_quality:
    name: WordPress coding standards + PHPCompatibility
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install quality dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run WPCS and PHPCompatibility
        run: bash scripts/ci-run.sh "WPCS + PHPCompatibility" bash -c 'vendor/bin/phpcs -q --standard=phpcs.xml.dist --report=json > phpcs-report.json'

      - name: Summarize WPCS and PHPCompatibility findings
        if: ${{ always() && hashFiles('phpcs-report.json') != '' }}
        shell: bash
        run: |
          {
            echo "## WPCS + PHPCompatibility structured findings"
            echo
            jq -r '
              .files
              | to_entries[]
              | .key as $file
              | .value.messages[]
              | "- **\($file):\(.line):\(.column)** `\(.source)` — \(.message)"
            ' phpcs-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build PHPCBF remediation candidate
        if: ${{ failure() && hashFiles('phpcs-report.json') != '' }}
        shell: bash
        run: |
          set +e
          vendor/bin/phpcbf -q --standard=phpcs.xml.dist
          phpcbf_status=$?
          vendor/bin/phpcs -q --standard=phpcs.xml.dist --report=json > phpcs-after-phpcbf.json
          post_status=$?
          set -e

          git diff -- ai-search-optimizer.php uninstall.php includes > phpcbf.patch
          echo "PHPCBF exit: $phpcbf_status"
          echo "Post-fix PHPCS exit: $post_status"
          git diff --stat -- ai-search-optimizer.php uninstall.php includes

      - name: Upload PHP quality diagnostics
        if: ${{ always() && hashFiles('phpcs-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: php-quality-diagnostics-${{ github.run_id }}
          path: |
            phpcs-report.json
            phpcs-after-phpcbf.json
            phpcbf.patch
            ai-search-optimizer.php
            uninstall.php
            includes/
          if-no-files-found: error
          retention-days: 30

  wordpress_plugin_check:
    name: WordPress Plugin Check
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production-shaped plugin package
        run: bash scripts/ci-run.sh "WordPress Plugin Check package" bash scripts/build-plugin.sh

      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./dist/ai-search-optimizer
          wp-version: latest
          categories: |
            plugin_repo
            security
            accessibility
            performance

  runtime:
    name: Runtime WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '5.6'
            php: '7.4'
          - wordpress: '6.8'
            php: '8.2'
          - wordpress: '7.1'
            php: '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package for runtime
        run: bash scripts/ci-run.sh "Build runtime package" bash scripts/build-plugin.sh

      - name: Packaged WordPress runtime acceptance
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          PHP_VERSION: ${{ matrix.php }}
        run: bash scripts/ci-run.sh "WordPress $WP_VERSION / PHP $PHP_VERSION runtime" bash scripts/runtime-wordpress.sh

  multisite_woocommerce:
    name: Multisite + WooCommerce runtime
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package for Multisite runtime
        run: bash scripts/ci-run.sh "Build Multisite runtime package" bash scripts/build-plugin.sh

      - name: Packaged Multisite and WooCommerce acceptance
        env:
          WP_VERSION: '7.1'
          PHP_VERSION: '8.3'
          WOO_VERSION: '11.1.0'
        run: bash scripts/ci-run.sh "Multisite + WooCommerce runtime" bash scripts/runtime-multisite-woocommerce.sh

  admin_ux:
    name: Real browser admin UX EN/ES
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package for browser acceptance
        run: bash scripts/ci-run.sh "Build browser runtime package" bash scripts/build-plugin.sh

      - name: Browser responsive and accessibility acceptance
        env:
          WP_VERSION: '7.1'
          PHP_VERSION: '8.3'
        run: bash scripts/ci-run.sh "Real browser admin UX EN/ES" bash scripts/runtime-admin-ux.sh

  release_lifecycle:
    name: Release package lifecycle + 0.4.0 upgrade
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout full release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact current stable candidate
        run: |
          bash scripts/ci-run.sh "Build current stable candidate" bash scripts/build-release-candidate.sh
          echo "0eb87610ddd5c2d348d3450c45792f63e5a47acc8dc103e650d188f98f10c85e  dist/ai-search-optimizer-0.5.0.zip" | sha256sum -c -

      - name: Rebuild accepted 0.4.0 package
        shell: bash
        run: |
          set -euo pipefail
          previous_dir="$RUNNER_TEMP/ai-search-optimizer-0.4.0-source"
          previous_zip="$RUNNER_TEMP/ai-search-optimizer-0.4.0.zip"
          git worktree add --detach "$previous_dir" 4d68b111d1f796fdc9bfbc3e670eeecc69c09a76
          bash "$previous_dir/scripts/build-plugin.sh"
          echo "27e5212a6bba188bc79d30a0edf3d1d662339f50f9938fa3618bb6b21bcd558c  $previous_dir/dist/ai-search-optimizer-0.4.0.zip" | sha256sum -c -
          cp "$previous_dir/dist/ai-search-optimizer-0.4.0.zip" "$previous_zip"
          git worktree remove --force "$previous_dir"

      - name: Clean install, upgrade and uninstall acceptance
        env:
          CURRENT_PACKAGE: ${{ github.workspace }}/dist/ai-search-optimizer-0.5.0.zip
          PREVIOUS_PACKAGE: ${{ runner.temp }}/ai-search-optimizer-0.4.0.zip
          CURRENT_VERSION: '0.5.0'
          PREVIOUS_VERSION: '0.4.0'
          EXPECTED_CURRENT_SHA: 0eb87610ddd5c2d348d3450c45792f63e5a47acc8dc103e650d188f98f10c85e
          EXPECTED_PREVIOUS_SHA: 27e5212a6bba188bc79d30a0edf3d1d662339f50f9938fa3618bb6b21bcd558c
          WP_VERSION: '7.1'
          PHP_VERSION: '8.3'
        run: bash scripts/ci-run.sh "Release package lifecycle + upgrade" bash scripts/runtime-release-lifecycle.sh

  package_evidence:
    name: Reproducible stable candidate package evidence
    needs: [validate, php_quality, wordpress_plugin_check, runtime, multisite_woocommerce, admin_ux, release_lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build reproducible stable candidate package
        run: bash scripts/ci-run.sh "Stable candidate package reproducibility" bash scripts/build-release-candidate.sh

      - name: Verify stable candidate package contents
        run: bash scripts/ci-run.sh "Stable candidate package contents" bash scripts/check-package.sh

      - name: Publish CI stable-candidate package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-optimizer-stable-candidate-${{ github.sha }}
          path: |
            dist/ai-search-optimizer-*.zip
            dist/ai-search-optimizer-*.sha256
            dist/release-manifest.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
