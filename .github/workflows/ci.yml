name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment
        run: |
          php --version
          zip -v | head -n 2
          unzip -v | head -n 2

      - name: PHP syntax
        run: bash scripts/ci-run.sh "PHP syntax" bash -c 'find ai-search-optimizer.php uninstall.php includes tests -name "*.php" -type f -print0 | xargs -0 -n1 php -l'

      - name: Shell syntax
        run: bash scripts/ci-run.sh "Shell syntax" bash -n scripts/runtime-wordpress.sh

      - name: Contract and security regression
        run: bash scripts/ci-run.sh "Contract and security regression" php tests/contract-check.php

      - name: Local Free analysis regression
        run: bash scripts/ci-run.sh "Local Free analysis regression" php tests/local-free-check.php

      - name: Safe local publication regression
        run: bash scripts/ci-run.sh "Safe local publication regression" php tests/local-publication-check.php

      - name: Lifecycle and uninstall regression
        run: bash scripts/ci-run.sh "Lifecycle and uninstall regression" php tests/lifecycle-check.php

      - name: Build plugin package
        run: bash scripts/ci-run.sh "Build plugin package" bash scripts/build-plugin.sh

      - name: Verify package contents
        run: bash scripts/ci-run.sh "Verify package contents" bash scripts/check-package.sh

      - name: Verify repository cleanliness
        run: |
          if [[ -n "$(git status --short --untracked-files=all)" ]]; then
            git status --short --untracked-files=all
            echo "Repository changed during validation." >&2
            exit 1
          fi

  runtime:
    name: Runtime WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '5.6'
            php: '7.4'
          - wordpress: '6.8'
            php: '8.2'
          - wordpress: '7.1'
            php: '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package for runtime
        run: bash scripts/ci-run.sh "Build runtime package" bash scripts/build-plugin.sh

      - name: Packaged WordPress runtime acceptance
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          PHP_VERSION: ${{ matrix.php }}
        run: bash scripts/ci-run.sh "WordPress $WP_VERSION / PHP $PHP_VERSION runtime" bash scripts/runtime-wordpress.sh
