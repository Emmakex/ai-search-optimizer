name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment
        run: |
          php --version
          zip -v | head -n 2
          unzip -v | head -n 2

      - name: PHP syntax
        run: php -l ai-search-optimizer.php

      - name: Contract and security regression
        run: php tests/contract-check.php

      - name: Build plugin package
        run: bash scripts/build-plugin.sh

      - name: Verify package contents
        run: |
          ZIP="$(find dist -maxdepth 1 -name 'ai-search-optimizer-*.zip' -type f -print -quit)"
          test -n "$ZIP"
          unzip -Z1 "$ZIP" | sort > /tmp/package-files.txt
          cat /tmp/package-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          ai-search-optimizer/
          ai-search-optimizer/LICENSE
          ai-search-optimizer/ai-search-optimizer.php
          ai-search-optimizer/readme.txt
          EOF
          diff -u /tmp/expected-files.txt /tmp/package-files.txt

      - name: Verify repository does not package generated artifacts
        run: git status --short --untracked-files=all | grep -v '^?? dist/' | grep -q . && { git status --short; exit 1; } || true
