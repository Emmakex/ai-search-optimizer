name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment
        run: |
          php --version
          zip -v | head -n 2
          unzip -v | head -n 2

      - name: PHP syntax
        run: bash scripts/ci-run.sh "PHP syntax" php -l ai-search-optimizer.php

      - name: Contract and security regression
        run: bash scripts/ci-run.sh "Contract and security regression" php tests/contract-check.php

      - name: Build plugin package
        run: bash scripts/ci-run.sh "Build plugin package" bash scripts/build-plugin.sh

      - name: Verify package contents
        run: bash scripts/ci-run.sh "Verify package contents" bash scripts/check-package.sh

      - name: Verify repository cleanliness
        run: |
          if [[ -n "$(git status --short --untracked-files=all)" ]]; then
            git status --short --untracked-files=all
            echo "Repository changed during validation." >&2
            exit 1
          fi
